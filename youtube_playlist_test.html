<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Playlist Test - Click to Play</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            margin-bottom: 20px;
            color: #ff4444;
        }
        .player-section {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        #player-wrapper {
            flex: 1;
            min-width: 300px;
        }
        #player {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }
        .playlist-panel {
            width: 350px;
            background: #1a1a1a;
            border-radius: 8px;
            padding: 15px;
            max-height: 500px;
            overflow-y: auto;
        }
        .playlist-panel h2 {
            margin-bottom: 15px;
            font-size: 16px;
            color: #aaa;
        }
        .song-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            margin-bottom: 5px;
            background: #252525;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .song-item:hover {
            background: #333;
        }
        .song-item.playing {
            background: #3d1a1a;
            border-left: 3px solid #ff4444;
        }
        .song-index {
            width: 25px;
            text-align: center;
            color: #888;
            font-size: 14px;
        }
        .song-item.playing .song-index {
            color: #ff4444;
        }
        .song-info {
            flex: 1;
            overflow: hidden;
        }
        .song-title {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .debug-panel {
            margin-top: 20px;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 8px;
        }
        .debug-panel h3 {
            margin-bottom: 10px;
            color: #888;
        }
        #debug-log {
            font-family: monospace;
            font-size: 12px;
            color: #0f0;
            max-height: 200px;
            overflow-y: auto;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            background: #252525;
            border-radius: 4px;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .status-label {
            color: #888;
        }
        .status-value {
            color: #fff;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 YouTube Playlist Test</h1>
        
        <div class="player-section">
            <div id="player-wrapper">
                <div id="player"></div>
                
                <div class="status">
                    <div class="status-item">
                        <span class="status-label">Player State:</span>
                        <span class="status-value" id="player-state">Loading...</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Current Index:</span>
                        <span class="status-value" id="current-index">-</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Playlist Size:</span>
                        <span class="status-value" id="playlist-size">-</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Current Video ID:</span>
                        <span class="status-value" id="current-video-id">-</span>
                    </div>
                </div>
            </div>
            
            <div class="playlist-panel">
                <h2>📋 Playlist (click to play)</h2>
                <div id="playlist-items">
                    <p style="color: #888;">Loading playlist...</p>
                </div>
            </div>
        </div>
        
        <div class="debug-panel">
            <h3>🔍 Debug Log</h3>
            <div id="debug-log"></div>
        </div>
    </div>

    <script>
        // Your playlist ID (without the PL prefix for the API)
        const PLAYLIST_ID = 'PLapBjnjxE544UhqAe21EDiSWF61rVvzLK';
        
        let player;
        let playlistVideos = [];
        
        function log(message) {
            const logEl = document.getElementById('debug-log');
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML = `[${time}] ${message}<br>` + logEl.innerHTML;
            console.log(message);
        }
        
        function updateStatus() {
            if (!player || typeof player.getPlaylistIndex !== 'function') return;
            
            try {
                const state = player.getPlayerState();
                const stateNames = {
                    '-1': 'Unstarted',
                    '0': 'Ended',
                    '1': 'Playing',
                    '2': 'Paused',
                    '3': 'Buffering',
                    '5': 'Video Cued'
                };
                document.getElementById('player-state').textContent = stateNames[state] || state;
                
                const index = player.getPlaylistIndex();
                document.getElementById('current-index').textContent = `${index} (0-based)`;
                
                const playlist = player.getPlaylist();
                if (playlist) {
                    document.getElementById('playlist-size').textContent = playlist.length;
                }
                
                const videoData = player.getVideoData();
                if (videoData && videoData.video_id) {
                    document.getElementById('current-video-id').textContent = videoData.video_id;
                }
                
                // Update highlighted song in list
                updatePlaylistHighlight(index);
            } catch (e) {
                // Player not ready yet
            }
        }
        
        function updatePlaylistHighlight(currentIndex) {
            document.querySelectorAll('.song-item').forEach((item, i) => {
                if (i === currentIndex) {
                    item.classList.add('playing');
                } else {
                    item.classList.remove('playing');
                }
            });
        }
        
        function renderPlaylist(videoIds) {
            const container = document.getElementById('playlist-items');
            container.innerHTML = '';
            
            videoIds.forEach((videoId, index) => {
                const item = document.createElement('div');
                item.className = 'song-item';
                item.innerHTML = `
                    <span class="song-index">${index + 1}</span>
                    <div class="song-info">
                        <div class="song-title">Video: ${videoId}</div>
                    </div>
                `;
                
                item.addEventListener('click', () => {
                    log(`Clicked song at index ${index} (0-based)`);
                    playVideoAtIndex(index);
                });
                
                container.appendChild(item);
            });
        }
        
        function playVideoAtIndex(index) {
            if (!player) {
                log('ERROR: Player not ready');
                return;
            }
            
            log(`Calling player.playVideoAt(${index})`);
            
            try {
                // Method 1: Use playVideoAt (should work for playlists)
                player.playVideoAt(index);
                log(`playVideoAt(${index}) called successfully`);
            } catch (e) {
                log(`ERROR with playVideoAt: ${e.message}`);
                
                // Fallback: Reload playlist at specific index
                try {
                    log(`Trying fallback: loadPlaylist with index ${index}`);
                    player.loadPlaylist({
                        listType: 'playlist',
                        list: PLAYLIST_ID,
                        index: index
                    });
                } catch (e2) {
                    log(`ERROR with fallback: ${e2.message}`);
                }
            }
        }
        
        // Load YouTube IFrame API
        var tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        
        // Called by YouTube API when ready
        function onYouTubeIframeAPIReady() {
            log('YouTube IFrame API Ready');
            
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                playerVars: {
                    'listType': 'playlist',
                    'list': PLAYLIST_ID,
                    'enablejsapi': 1,
                    'origin': window.location.origin,
                    'rel': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }
        
        function onPlayerReady(event) {
            log('Player Ready');
            
            // Wait a moment for playlist to load, then get video list
            setTimeout(() => {
                const playlist = player.getPlaylist();
                if (playlist && playlist.length > 0) {
                    log(`Playlist loaded with ${playlist.length} videos`);
                    playlistVideos = playlist;
                    renderPlaylist(playlist);
                } else {
                    log('Playlist not loaded yet, waiting...');
                    // Try again
                    setTimeout(() => {
                        const playlist2 = player.getPlaylist();
                        if (playlist2) {
                            log(`Playlist loaded (retry): ${playlist2.length} videos`);
                            playlistVideos = playlist2;
                            renderPlaylist(playlist2);
                        }
                    }, 2000);
                }
                updateStatus();
            }, 1000);
        }
        
        function onPlayerStateChange(event) {
            const stateNames = {
                '-1': 'UNSTARTED',
                '0': 'ENDED',
                '1': 'PLAYING',
                '2': 'PAUSED',
                '3': 'BUFFERING',
                '5': 'CUED'
            };
            log(`State changed: ${stateNames[event.data]} (${event.data})`);
            
            // When video changes, update the playlist display
            if (event.data === YT.PlayerState.PLAYING || event.data === YT.PlayerState.CUED) {
                const index = player.getPlaylistIndex();
                const videoData = player.getVideoData();
                log(`Now playing index ${index}: ${videoData?.title || videoData?.video_id}`);
            }
            
            updateStatus();
        }
        
        function onPlayerError(event) {
            log(`ERROR: ${event.data}`);
        }
        
        // Update status periodically
        setInterval(updateStatus, 1000);
    </script>
</body>
</html>
